[platformio]
default_envs = validation

[env]
platform = nordicnrf52@10.11.0
framework = zephyr
board = dwm3001c_custom
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.zephyr.cmake_extra_args = -DBOARD_ROOT="${PROJECT_DIR}"
build_flags = -Iinclude -DCONFIG_DW3000_CHIP_DW3000=1

[env:validation]

[env:validation_b]
build_flags = ${env.build_flags} -DFW_VERSION_PATCH=18 -DVALIDATION_LED_BLINK=1

[env:reference]
build_flags = ${env.build_flags} -DREFERENCE_RANGING=1 -DFW_VERSION_MINOR=1 -DFW_VERSION_PATCH=0 -DVALIDATION_LED_BLINK=1

[env:dstwr]
build_flags = ${env.build_flags} -DDSTWR_TDMA=1 -DFW_VERSION_MINOR=2 -DFW_VERSION_PATCH=0 -DVALIDATION_LED_BLINK=1

[env:dstwr_sniffer]
build_flags = ${env.build_flags} -DDSTWR_TDMA=1 -DDSTWR_SNIFFER_MODE=1 -DFW_VERSION_MINOR=2 -DFW_VERSION_PATCH=1
monitor_speed = 1000000

[env:swarm]
board_build.zephyr.cmake_extra_args = ${env.board_build.zephyr.cmake_extra_args} -DOVERLAY_CONFIG=swarm.conf
build_flags = ${env.build_flags} -DSWARM_RANGING=1 -DFW_VERSION_MINOR=2 -DFW_VERSION_PATCH=7 -DVALIDATION_LED_BLINK=1

